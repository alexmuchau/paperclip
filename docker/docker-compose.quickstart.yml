services:
  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      PATH: "/paperclip/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      HOST: "0.0.0.0"
      PAPERCLIP_BIND: "lan"
      PAPERCLIP_HOME: "/paperclip"
      RTK_TELEMETRY_DISABLED: "1"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      GH_TOKEN: "${GH_TOKEN:-}"
      PAPERCLIP_GITHUB_TOKEN: "${PAPERCLIP_GITHUB_TOKEN:-}"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}"
    volumes:
      - paperclip-data:/paperclip
      - /home/alekkdev/Repositories/muchaw-knowledge:/workspace/muchaw-knowledge:ro
      - /home/alekkdev/Repositories/muchaw-knowledge/agent-output:/workspace/muchaw-knowledge/agent-output:rw
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

volumes:
  paperclip-data:
